name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.20'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements-cpu.txt
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify CPU environment
        run: python scripts/verify_environment.py --device cpu
      - name: Run unit tests
        run: python -m pytest -q
# This workflow never downloads CIFAR-100, loads a teacher, or trains a model.
# The separate smoke_test.yml workflow validates the full tiny CPU pipeline.
