name: CPU Pipeline Smoke Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.20'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_smoke_test.py --device cpu --dataset fake --batch-size 4
# Tiny synthetic data only. No real CIFAR-100, downloaded checkpoint, or GPU training.
